name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:8.0
        ports: ['27018:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash -n install.sh
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/package-release.mjs "$GITHUB_REF_NAME"
      - run: node scripts/smoke-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/release/*
          if-no-files-found: error
  publish:
    needs: verify-and-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
